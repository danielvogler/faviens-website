<!--
  PROVISIONAL. Regenerate once a mark is chosen. The wordmark here carries no
  gold tittle: the build rasteriser has no Archivo, so a dot positioned over
  the i by estimated metrics would land off the stem (handoff §8.1, §8.4).
  The gold event is the interpunct in the descriptor instead: metric-free,
  and a divider rather than type, so the small-type gold floor does not apply.
-->
