<!--
  The 16px favicon, and only that size.

  Three letters at 16px are five pixels each, which is below what any typeface
  survives: FAV at that size is three grey smudges. So the smallest icon drops
  to one letter, in the accent, which is the same trade every serious icon set
  makes rather than shipping one drawing scaled past its limit.

  The F is set larger here than the three letters are in favicon.svg, because a
  single glyph has the whole tile to use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="{{paper}}"/>
  <text x="202" y="316" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="400" font-weight="800" text-anchor="middle" fill="{{accent}}">F</text>
</svg>
