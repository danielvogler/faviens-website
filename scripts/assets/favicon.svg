<!--
  The favicon at 32px and above. Colours are placeholders in double braces
  naming an rgb token in src/styles/global.css (the rgb-prefixed ones), and
  {{globe:NAME}} is the wound-string mark generated by src/lib/globe.mjs,
  normalised into a 100 x 100 box so this file can place it with a plain
  translate and scale. Both are substituted by scripts/generate-og.mjs at
  prebuild and predev: a standalone SVG has no page to inherit a CSS custom
  property from, and no way to run the generator.

  The empty globe, no F. It is the mark the identity is built on, and it is the
  one element that survives being cut to 32 pixels, which three letters do not.

  Paper rather than ink, matching the site's own ground, and the same trade the
  letter icon before it made: against a white tab the tile edge disappears and
  the icon is the globe alone, and in a browser running dark chrome it becomes a
  bright square. The alternative was an ink tile that looks like a different
  brand from the page it opens.

  The real mark, all sixty strands, with the strokes inked heavier for the
  raster: the logo's own hairline is a third of a pixel at 32px, which is a
  third of the accent's strength, and the icon comes out a pale disc. Same
  drawing, thicker line.

  This file is never published. It is the source the PNG icons are rasterised
  from, and BaseHead.astro offers those and no SVG icon: a browser handed an SVG
  favicon prefers it and then rasterises sixty hairlines however it likes.

  The globe fills 88% of the tile. Tighter and it fouls the tab's own rounding;
  looser and the strands drop below a pixel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="{{paper}}"/>
  <g transform="translate(24 24) scale(3.52)">{{globe:icon}}</g>
</svg>
