<!--
  The favicon at 32px and above, and every PNG icon rasterised from it. Colours
  are placeholders in double braces naming an rgb token in src/styles/global.css
  (the rgb-prefixed ones), substituted by scripts/generate-og.mjs at prebuild
  and predev: a standalone SVG has no page to inherit a CSS custom property
  from, so this is how the icon stays on the palette.

  FAV on paper, with the accent on the A. The wordmark's device is that the A
  and the I are the only coloured letters, and a truncation to three keeps one
  of them, so the icon is the mark cut short rather than a different mark.

  Paper rather than ink, matching the site's own ground. The cost is that
  against a white browser tab the tile edge disappears and the icon is whatever
  the letters are, and in a browser running dark chrome it becomes a bright
  square. Both are deliberate: the alternative was an ink tile that looks like a
  different brand from the page it opens.

  The letters fill the tile to about 92% of its width, which is what makes them
  hold at 32px. Below that they stop being readable as letters whatever the
  size, so scripts/assets/favicon-small.svg carries the 16px artwork instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="{{paper}}"/>
  <text x="200" y="272" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="200" font-weight="800" text-anchor="middle" letter-spacing="-9" fill="{{ink}}">F<tspan fill="{{accent}}">A</tspan>V</text>
</svg>
