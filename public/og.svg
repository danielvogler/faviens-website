  <rect width="1200" height="630" fill="#FDFDFB"/>
  <text x="90" y="368" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-5.25" fill="#0E0E10">faviens</text>
  <text x="94" y="446" xml:space="preserve" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="6.4" fill="#71716E">AGENTIC-AI CONSULTING <tspan fill="#A6813A">·</tspan> ZÜRICH</text>
</svg>
