<!--
  The square mark for off-site profiles, truncated to three letters the way
  favicon.svg is, and for the same reason: seven letters in a profile avatar are
  unreadable at the size LinkedIn actually renders one. The A stays in the
  accent, so the truncation keeps one of the two letters the whole device rests
  on rather than becoming a different mark.

  No background rect. See brand-wordmark.svg for why.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <text x="400" y="300" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="280" font-weight="800" text-anchor="middle" letter-spacing="-12" fill="{{ink}}">F<tspan fill="{{accent}}">A</tspan>V</text>
</svg>
