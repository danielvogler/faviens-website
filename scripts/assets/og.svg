<!--
  The link preview image. Colours are placeholders in double braces naming an
  rgb token in src/styles/global.css (the rgb-prefixed ones), substituted by
  scripts/generate-og.mjs at prebuild and predev: a standalone SVG has no page
  to inherit a CSS custom property from, so this is how the image stays on the
  palette instead of drifting off it.

  The mark, at the mark's own proportions: capitals with the A and the I in the
  accent. Set in a grotesque fallback because the build rasteriser has no access
  to Archivo, so the letterforms are close rather than exact. That is visible at
  1200x630 and is the price of generating this at build time instead of pasting
  in an export that would go stale the next time the palette moved.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="{{paper}}"/>
  <text x="90" y="352" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="140" font-weight="800" letter-spacing="-1.7" fill="{{ink}}">F<tspan fill="{{accent}}">A</tspan>V<tspan fill="{{accent}}">I</tspan>ENS</text>
  <text x="94" y="430" xml:space="preserve" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="6.4" fill="{{grey}}">AGENTIC-AI CONSULTING <tspan fill="{{accent}}">·</tspan> ZÜRICH</text>
</svg>
